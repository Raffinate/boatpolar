<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Find the fastest heading toward your destination from a boat polar and the wind." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3 L16 26 L6 26 Z' fill='%230ea5e9'/%3E%3Cpath d='M18 8 L18 26 L26 26 Z' fill='%23334155'/%3E%3Cpath d='M4 28 H28' stroke='%23334155' stroke-width='2'/%3E%3C/svg%3E" />
    <title>Boat Polar Solver</title>
    <script>
      // Before first paint, so the page never flashes the wrong theme. Mirrors src/lib/theme.ts: the "theme" key is
      // shared with the other raffinate.github.io sites; without it, follow the OS.
      ;(() => {
        let t = null
        try {
          t = localStorage.getItem("theme")
        } catch {}
        document.documentElement.dataset.theme =
          t === "light" || t === "dark" ? t : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
